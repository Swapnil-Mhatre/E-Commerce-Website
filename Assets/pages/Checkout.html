<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <header></header>
        <section class="checkout-section">
            <div class="wrapper">
                <div class="shipping-information">
                    <h1 class="page-title">Shipping Details</h1>
                    <form action="" id="confirmation-form">
                        <div class="name">
                            <div>
                                <label for="first-name">First Name</label>
                                <input type="text" id="first-name" name="first-name" required>
                            </div>
                            <div>
                                <label for="last-name">Last Name</label>
                                <input type="text" id="last-name" name="last-name" required>
                            </div>
                        </div>
                        <div class="contact-dets">
                            <div>
                                <label for="phone-number">Phone Number</label>
                                <input type="number" id="phone-number" name="phone-number" required>
                            </div>
                            <div>
                                <label for="email-address">E-mail</label>
                                <input type="email" id="email-address" name="email-address" required>
                            </div>
                        </div>
                        <select name="country" id="country">
                            <option value="">Choose Your Country:</option>
                            <option value="india">India</option>
                            <option value="united Kingdom">United Kingdom</option>
                            <option value="russia">Russia</option>
                            <option value="philippines">Philippines</option>
                            <option value="iceland">Iceland</option>
                            <option value="hongkong">Hong Kong</option>
                            <option value="canada">Canada</option>
                            <option value="switzerland">Switzerland</option>
                        </select>
                        <div class="address">
                            <div>
                                <label for="address-1">Address Line 1</label>
                                <input type="text" id="address-1" name="address-1" required>
                            </div>
                            <div>
                                <label for="address-2">Address Line 2</label>
                                <input type="text" id="address-2" name="address-2">
                            </div>
                            <div>
                                <label for="postal-code">Postcode / ZIP</label>
                                <input type="number" id="postal-code" name="postal-code" required>
                            </div>
                            <div>
                                <label for="city">Town / City</label>
                                <input type="text" id="city" name="city" required>
                            </div>
                        </div>
                        <div class="submit">
                            <input type="submit" value="Confirm Order" id="Confirmation">
                        </div>
                    </form>
                </div>
                <div class="billing">
                    <h2>Order Summary</h2>
                    <div class="summary-list"></div>
                    <div class="total-amount">
                        <h3>Total amount</h3>
                        <h4 id="total-bill">₹ ${TotalBill}</h4>
                    </div>
                </div>
            </div>
        </section>
        <footer></footer>
    </main>
    <script type="module" src="../js/script.js"></script>
</body>

</html>
