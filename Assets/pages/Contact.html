<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <header></header>
        <section class="contact-section">
            <h1 class="page-title">Contact Us</h1>
            <div class="wrapper">
                <div class="info-cards">
                    <div class="info-card">
                        <i class="ri-phone-fill"></i>
                        <h2>Let's Talk</h2>
                        <p><span>Phone:</span> 9983274619</p>
                    </div>
                    <div class="info-card">
                        <i class="ri-mail-fill"></i>
                        <h2>Email us At</h2>
                        <p><span>Email:</span> fashionplayz@gmail.com</p>
                    </div>
                    <div class="info-card">
                        <i class="ri-lifebuoy-line"></i>
                        <h2>24x7 Support</h2>
                        <p><span>Customer: </span> 1800 101 303</p>
                    </div>
                </div>
                <div class="contact-form">
                    <h2>Contact Form</h2>
                    <form action="">
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Name">
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Email">
                        </div>
                        <div>
                            <label for="message">Message</label>
                            <textarea name="textBox" id="message" name="message" placeholder="Message"></textarea>
                        </div>
                        <input type="submit" value="Submit">
                    </form>
                </div>
            </div>
        </section>
        <footer></footer>
    </main>
    <script type="module" src="../js/script.js"></script>
</body>

</html>
