<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Plays Product Page</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <header></header>
        <section class="products-page">
            <button class="filter-category">Open Filter</button>
            <div class="filter-section" hidden>
                <ul class="category-name-list"></ul>
                <div class="price-filter-container">
                    <div class="val">
                        <span>100</span> - <span id="value">∞</span>
                    </div>
                    <input type="range" name="price-filter" id="price-filter" min="100" max="2000" value="" step="100">
                </div>
            </div>
            <div class="products-section">
                <div class="wrapper"></div>
            </div>
        </section>
        <footer></footer>
    </main>
    <script type="module" src="../js/script.js"></script>
</body>

</html>
